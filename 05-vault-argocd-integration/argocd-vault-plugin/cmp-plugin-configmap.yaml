# ConfigManagementPlugin (CMP) configuration for the Argo Vault Plugin.
#
# This ConfigMap defines how AVP processes manifests.
# It's mounted into the AVP sidecar container.

apiVersion: v1
kind: ConfigMap
metadata:
  name: cmp-plugin
  namespace: argocd
data:
  # AVP with plain YAML manifests
  avp.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: argocd-vault-plugin
    spec:
      allowConcurrency: true
      discover:
        find:
          # Discover YAML files containing AVP placeholders
          command:
            - sh
            - "-c"
            - "find . -name '*.yaml' | xargs -I {} grep -l '<path\\|<secret' {} || true"
      generate:
        command:
          - argocd-vault-plugin
          - generate
          - "."
      lockRepo: false

  # AVP with Kustomize
  avp-kustomize.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: argocd-vault-plugin-kustomize
    spec:
      allowConcurrency: true
      discover:
        find:
          command:
            - sh
            - "-c"
            - "find . -name 'kustomization.yaml' | head -1"
      generate:
        command:
          - sh
          - "-c"
          - "kustomize build . | argocd-vault-plugin generate -"
      lockRepo: false

  # AVP with Helm
  avp-helm.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: argocd-vault-plugin-helm
    spec:
      allowConcurrency: true
      discover:
        find:
          command:
            - sh
            - "-c"
            - "find . -name 'Chart.yaml' | head -1"
      generate:
        command:
          - sh
          - "-c"
          - |
            helm template "$ARGOCD_APP_NAME" . \
              --namespace "$ARGOCD_APP_NAMESPACE" \
              --include-crds \
              -f <(echo "$ARGOCD_ENV_HELM_VALUES") \
            | argocd-vault-plugin generate -
      lockRepo: false
