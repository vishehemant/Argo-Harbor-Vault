# Patch for the Argo CD repo-server Deployment to add the AVP sidecar.
#
# Apply with:
#   kubectl patch deployment argocd-repo-server -n argocd --patch-file argocd-repo-server-patch.yaml
#
# Or use this as a strategic merge patch.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  template:
    spec:
      # The ServiceAccount must match the Vault Kubernetes auth role
      serviceAccountName: argocd-repo-server
      automountServiceAccountToken: true

      # Init container: download the AVP binary
      initContainers:
        - name: download-avp
          image: alpine:3.19
          command:
            - sh
            - "-c"
            - |
              wget -O /custom-tools/argocd-vault-plugin \
                https://github.com/argoproj-labs/argocd-vault-plugin/releases/download/v1.17.0/argocd-vault-plugin_1.17.0_linux_amd64
              chmod +x /custom-tools/argocd-vault-plugin
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools

      # Sidecar container: runs the AVP plugin server
      containers:
        - name: avp
          # Use a lightweight image with necessary tools
          image: quay.io/argoproj/argocd:v2.10.0
          command:
            - /var/run/argocd/argocd-cmp-server
          env:
            # Vault connection settings
            - name: AVP_TYPE
              value: vault
            - name: AVP_AUTH_TYPE
              value: k8s
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: AVP_K8S_ROLE
              value: argocd
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          volumeMounts:
            - name: var-files
              mountPath: /var/run/argocd
            - name: plugins
              mountPath: /home/argocd/cmp-server/plugins
            - name: cmp-plugin
              mountPath: /home/argocd/cmp-server/config/plugin.yaml
              subPath: avp.yaml
            - name: custom-tools
              mountPath: /usr/local/bin/argocd-vault-plugin
              subPath: argocd-vault-plugin
            - name: cmp-tmp
              mountPath: /tmp

      volumes:
        - name: cmp-plugin
          configMap:
            name: cmp-plugin
        - name: custom-tools
          emptyDir: {}
        - name: cmp-tmp
          emptyDir: {}
