# Argo CD Application that uses the Argo Vault Plugin.
#
# The key difference from a normal Application:
#   source.plugin.name = "argocd-vault-plugin"
#
# This tells Argo CD to process the manifests through AVP,
# which replaces <path:...#key> placeholders with real Vault secrets.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-argocd-demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/vishehemant/Argo-Harbor-Vault.git
    targetRevision: cursor/harbor-argo-vault-integration-aad0
    path: 05-vault-argocd-integration/sample-app

    # THIS is the integration point: use the AVP plugin
    plugin:
      name: argocd-vault-plugin

  destination:
    server: https://kubernetes.default.svc
    namespace: vault-argocd-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
