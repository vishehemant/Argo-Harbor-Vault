# Deployment that consumes secrets injected by AVP.
#
# The Secret "myapp-secrets" is created by secret.yaml (with AVP placeholders).
# AVP resolves the placeholders at sync time, so the actual Secret in the
# cluster contains real values. This Deployment references those Secrets
# as environment variables.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-web
  namespace: vault-argocd-demo
  labels:
    app: sample-web
    scenario: vault-argocd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-web
  template:
    metadata:
      labels:
        app: sample-web
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
              name: http
          env:
            # Database credentials — sourced from the AVP-managed Secret
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: myapp-secrets
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: myapp-secrets
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: myapp-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: myapp-secrets
                  key: DB_PASSWORD

            # API keys — sourced from a separate AVP-managed Secret
            - name: STRIPE_KEY
              valueFrom:
                secretKeyRef:
                  name: myapp-api-keys
                  key: STRIPE_KEY

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
