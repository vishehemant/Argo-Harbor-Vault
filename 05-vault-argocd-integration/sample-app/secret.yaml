# Kubernetes Secret with AVP (Argo Vault Plugin) placeholders.
#
# THIS FILE IS SAFE TO COMMIT TO GIT because it contains
# NO real secrets — only references to Vault paths.
#
# At sync time, AVP replaces <path:...#key> with real values from Vault.

apiVersion: v1
kind: Secret
metadata:
  name: myapp-secrets
  namespace: vault-argocd-demo
  annotations:
    # Annotation to tell AVP to process this manifest
    avp.kubernetes.io/path: "secret/data/myapp/config"
type: Opaque
stringData:
  # Each value is an AVP placeholder that maps to a Vault KV key.
  #
  # Format: <path:VAULT_PATH#KEY>
  # The path "secret/data/myapp/config" is the KV v2 path.
  # (KV v2 adds "data/" between the mount and the secret path)
  DB_HOST: <path:secret/data/myapp/config#db_host>
  DB_PORT: <path:secret/data/myapp/config#db_port>
  DB_NAME: <path:secret/data/myapp/config#db_name>
  DB_USER: <path:secret/data/myapp/config#db_user>
  DB_PASSWORD: <path:secret/data/myapp/config#db_password>

---
# A second Secret for API keys (from a different Vault path)
apiVersion: v1
kind: Secret
metadata:
  name: myapp-api-keys
  namespace: vault-argocd-demo
type: Opaque
stringData:
  STRIPE_KEY: <path:secret/data/myapp/api-keys#stripe_key>
  SENDGRID_KEY: <path:secret/data/myapp/api-keys#sendgrid_key>
  REDIS_URL: <path:secret/data/myapp/api-keys#redis_url>
