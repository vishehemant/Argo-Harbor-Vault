# SecretStore: Tells the External Secrets Operator how to connect to Vault.
#
# This is scoped to a single namespace. For cluster-wide access,
# use a ClusterSecretStore instead.

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: my-app
spec:
  provider:
    vault:
      # Vault server address (accessible from within the cluster)
      server: "http://vault.vault.svc.cluster.local:8200"

      # Path where the KV v2 secrets engine is mounted
      path: "secret"

      # KV version (1 or 2)
      version: "v2"

      # Authentication method: Kubernetes ServiceAccount
      auth:
        kubernetes:
          # Vault role to authenticate as
          # This role must exist in Vault (created in 02-vault-basics/)
          mountPath: "kubernetes"
          role: "myapp"

          # ServiceAccount to use for authentication
          serviceAccountRef:
            name: "vault-auth-sa"

---
# ServiceAccount used by ESO to authenticate with Vault
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth-sa
  namespace: my-app

---
# For cluster-wide access (optional):
# A ClusterSecretStore can be used by ExternalSecrets in any namespace.

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-cluster-store
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "argocd"
          serviceAccountRef:
            name: "vault-auth-sa"
            namespace: "my-app"
