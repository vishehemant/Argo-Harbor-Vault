# ExternalSecret: Syncs application config from Vault into a K8s Secret.
#
# Vault path: secret/myapp/config
# Created K8s Secret: myapp-config (type: Opaque)
#
# This is the ESO equivalent of the AVP approach in scenario 05.
# Both achieve the same result (secrets from Vault in K8s), but:
#   - AVP: happens at Argo CD sync time (in the repo-server)
#   - ESO: happens continuously via the ESO controller

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: myapp-config
  namespace: my-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore

  target:
    name: myapp-config
    creationPolicy: Owner

  # Sync all keys from a Vault path at once
  dataFrom:
    - extract:
        key: myapp/config

---
# You can also sync specific keys with custom names

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: myapp-api-keys
  namespace: my-app
spec:
  refreshInterval: 30m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore

  target:
    name: myapp-api-keys
    creationPolicy: Owner

  data:
    - secretKey: STRIPE_API_KEY
      remoteRef:
        key: myapp/api-keys
        property: stripe_key

    - secretKey: SENDGRID_API_KEY
      remoteRef:
        key: myapp/api-keys
        property: sendgrid_key

    - secretKey: REDIS_URL
      remoteRef:
        key: myapp/api-keys
        property: redis_url
