# ExternalSecret: Syncs Harbor registry credentials from Vault
# into a Kubernetes docker-registry Secret.
#
# Vault path: secret/harbor/creds
# Created K8s Secret: harbor-pull-secret (type: kubernetes.io/dockerconfigjson)
#
# This replaces the hardcoded image-pull-secret.yaml from scenario 04.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-pull-secret
  namespace: my-app
spec:
  # How often to re-sync from Vault (catches rotated credentials)
  refreshInterval: 1h

  # Which SecretStore to use
  secretStoreRef:
    name: vault-backend
    kind: SecretStore

  # What Kubernetes Secret to create
  target:
    name: harbor-pull-secret
    creationPolicy: Owner
    # Create a docker-registry secret type
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "{{ .url }}": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "email": "{{ .email }}"
              }
            }
          }

  # Map Vault keys to template variables
  data:
    - secretKey: url
      remoteRef:
        key: harbor/creds
        property: url
    - secretKey: username
      remoteRef:
        key: harbor/creds
        property: username
    - secretKey: password
      remoteRef:
        key: harbor/creds
        property: password
    - secretKey: email
      remoteRef:
        key: harbor/creds
        property: email
