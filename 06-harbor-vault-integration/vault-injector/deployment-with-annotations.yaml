# Deployment with Vault Agent Injector annotations.
#
# The Vault Agent Injector (a mutating webhook) sees these annotations
# and automatically adds init + sidecar containers that:
#   1. Authenticate with Vault using the Pod's ServiceAccount
#   2. Fetch secrets from Vault
#   3. Write them as files into a shared volume
#   4. Keep them refreshed (sidecar stays running)
#
# The application reads secrets from /vault/secrets/ files.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-web-vault-injector
  namespace: my-app
  labels:
    app: sample-web
    scenario: vault-injector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-web
  template:
    metadata:
      labels:
        app: sample-web
      annotations:
        # ──────────────────────────────────────────────
        # Vault Agent Injector annotations
        # ──────────────────────────────────────────────

        # Enable Vault Agent injection
        vault.hashicorp.com/agent-inject: "true"

        # Vault Kubernetes auth role to use
        vault.hashicorp.com/role: "myapp"

        # Inject the database config as a file at /vault/secrets/db-config
        vault.hashicorp.com/agent-inject-secret-db-config: "secret/data/myapp/config"

        # Template: format the secret as environment variable exports
        # The file will contain: export DB_HOST=... export DB_PASSWORD=...
        vault.hashicorp.com/agent-inject-template-db-config: |
          {{- with secret "secret/data/myapp/config" -}}
          export DB_HOST="{{ .Data.data.db_host }}"
          export DB_PORT="{{ .Data.data.db_port }}"
          export DB_NAME="{{ .Data.data.db_name }}"
          export DB_USER="{{ .Data.data.db_user }}"
          export DB_PASSWORD="{{ .Data.data.db_password }}"
          {{- end }}

        # Inject API keys as a separate file
        vault.hashicorp.com/agent-inject-secret-api-keys: "secret/data/myapp/api-keys"
        vault.hashicorp.com/agent-inject-template-api-keys: |
          {{- with secret "secret/data/myapp/api-keys" -}}
          export STRIPE_KEY="{{ .Data.data.stripe_key }}"
          export SENDGRID_KEY="{{ .Data.data.sendgrid_key }}"
          export REDIS_URL="{{ .Data.data.redis_url }}"
          {{- end }}

        # Inject Harbor credentials as a JSON file (for Docker config)
        vault.hashicorp.com/agent-inject-secret-harbor-creds: "secret/data/harbor/creds"
        vault.hashicorp.com/agent-inject-template-harbor-creds: |
          {{- with secret "secret/data/harbor/creds" -}}
          {
            "auths": {
              "{{ .Data.data.url }}": {
                "username": "{{ .Data.data.username }}",
                "password": "{{ .Data.data.password }}"
              }
            }
          }
          {{- end }}

    spec:
      serviceAccountName: myapp-sa

      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          command:
            - sh
            - -c
            - |
              # Source the secrets written by Vault Agent
              source /vault/secrets/db-config
              source /vault/secrets/api-keys
              echo "DB_HOST=$DB_HOST"
              echo "Secrets loaded successfully!"
              nginx -g 'daemon off;'
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
