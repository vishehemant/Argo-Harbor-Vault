# Argo CD Repository Credential for Harbor (OCI / Helm charts)
#
# This allows Argo CD to pull Helm charts stored in Harbor's OCI registry.
# Argo CD manages repository credentials as Secrets with specific labels.

apiVersion: v1
kind: Secret
metadata:
  name: harbor-helm-repo
  namespace: argocd
  labels:
    # This label tells Argo CD "this is a repository credential"
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  # Repository type: helm for Helm charts
  type: helm
  # The Harbor URL
  url: harbor.example.com
  # Display name in the Argo CD UI
  name: harbor-charts
  # Enable OCI support (Harbor uses OCI for Helm chart storage)
  enableOCI: "true"
  # Credentials
  username: "robot$ci-pipeline"
  password: "REPLACE_WITH_ROBOT_SECRET"
