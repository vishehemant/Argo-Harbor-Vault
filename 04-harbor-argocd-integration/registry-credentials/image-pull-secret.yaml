# Kubernetes Secret for pulling images from a private Harbor registry.
#
# NOTE: In a real setup, do NOT commit actual credentials to Git.
#       Use Vault + External Secrets (see scenario 06) or SealedSecrets.
#       This example uses placeholder values for learning purposes.
#
# The .dockerconfigjson value is a base64-encoded Docker config.
# Generate it with:
#   kubectl create secret docker-registry harbor-pull-secret \
#     --docker-server=harbor.example.com \
#     --docker-username='robot$ci-pipeline' \
#     --docker-password='<secret>' \
#     --dry-run=client -o yaml

apiVersion: v1
kind: Secret
metadata:
  name: harbor-pull-secret
  namespace: my-app
  labels:
    app.kubernetes.io/managed-by: argocd
type: kubernetes.io/dockerconfigjson
stringData:
  # Using stringData so you can see the structure (K8s will base64 encode it)
  .dockerconfigjson: |
    {
      "auths": {
        "harbor.example.com": {
          "username": "robot$ci-pipeline",
          "password": "REPLACE_WITH_ROBOT_SECRET",
          "email": "ci@example.com"
        }
      }
    }
