# Argo CD Application with Image Updater annotations.
#
# The Image Updater watches Harbor for new image tags matching the
# configured pattern and automatically updates the Application.
#
# Flow:
#   1. CI pushes harbor.example.com/my-app/sample-web:v1.0.1
#   2. Image Updater detects the new tag
#   3. Image Updater updates the Application (or writes to Git)
#   4. Argo CD syncs the updated manifest to the cluster

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor-sample-app-auto-update
  namespace: argocd
  annotations:
    # Enable image updater for this Application
    argocd-image-updater.argoproj.io/image-list: >
      web=harbor.example.com/my-app/sample-web

    # Update strategy: semver — pick the highest semantic version tag
    # Other strategies: latest, digest, name (alphabetical)
    argocd-image-updater.argoproj.io/web.update-strategy: semver

    # Constrain to a version range (optional)
    argocd-image-updater.argoproj.io/web.allow-tags: "regexp:^v[0-9]+\\.[0-9]+\\.[0-9]+$"

    # How to write back the updated tag:
    #   "argocd" — update the Application spec directly (simpler)
    #   "git"    — commit the change to Git (true GitOps)
    argocd-image-updater.argoproj.io/write-back-method: git

    # Harbor credentials (references the Secret created above)
    argocd-image-updater.argoproj.io/web.pull-secret: pullsecret:argocd/harbor-pull-secret
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/vishehemant/Argo-Harbor-Vault.git
    targetRevision: main
    path: 04-harbor-argocd-integration/sample-app
  destination:
    server: https://kubernetes.default.svc
    namespace: my-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
