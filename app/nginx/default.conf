server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache control for static assets
    location ~* \.(html|css|js|ico|png|jpg|jpeg|gif|svg|woff|woff2)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Health check endpoint
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    # API info - use envsubst at container startup to replace ${APP_VERSION}, ${APP_ENV}, ${HOSTNAME}
    location /api/info {
        access_log off;
        default_type application/json;
        return 200 '{"version":"${APP_VERSION}","environment":"${APP_ENV}","hostname":"${HOSTNAME}"}';
    }

    # Prometheus metrics (stub_status)
    location /metrics {
        stub_status on;
        access_log off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
