# JFrog Artifactory Helm Values
# Reference: https://github.com/jfrog/charts/tree/master/stable/artifactory

# Use the OSS (open source) version for learning. Use Pro/Enterprise in production.
artifactory:
  image:
    repository: releases-docker.jfrog.io/jfrog/artifactory-oss
    tag: latest

  # Admin password (change in production!)
  admin:
    password: "password"

  persistence:
    enabled: true
    size: 5Gi

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi

  service:
    type: ClusterIP

# PostgreSQL database
postgresql:
  enabled: true
  persistence:
    size: 2Gi
  postgresqlPassword: "artifactory-db-pass"

# Nginx frontend
nginx:
  enabled: true
  service:
    type: NodePort
    nodePort: 30082

# Metrics for Prometheus
metrics:
  enabled: true

# Disable components not needed for learning
xray:
  enabled: false
distribution:
  enabled: false
insight:
  enabled: false
