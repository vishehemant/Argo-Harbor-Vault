# How Harbor and JFrog split responsibilities:
#
# HARBOR = Docker images (your app containers)
#   - Build image in CI → push to Harbor
#   - Harbor scans with Trivy → blocks vulnerable images
#   - Kubernetes pulls from Harbor (image pull secrets)
#
# JFROG = Everything else (build dependencies)
#   - npm packages → JFrog virtual npm repo
#   - Maven JARs → JFrog virtual Maven repo
#   - Python packages → JFrog virtual PyPI repo
#   - Go modules → JFrog virtual Go repo
#   - Helm charts → JFrog virtual Helm repo
#   - Public Docker images (base images) → JFrog Docker remote (proxy cache)
#
# This file demonstrates configuring a Dockerfile to pull base images
# through JFrog's Docker proxy (avoiding Docker Hub rate limits).

# Example: Dockerfile using JFrog as Docker Hub proxy
# Instead of:  FROM golang:1.22-alpine
# Use:         FROM jfrog.example.com/docker-remote/golang:1.22-alpine

---
# Kubernetes config: JFrog pull secret (for proxy-cached public images)
apiVersion: v1
kind: Secret
metadata:
  name: jfrog-pull-secret
  namespace: my-app
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "jfrog.example.com": {
          "username": "ci-user",
          "password": "REPLACE_WITH_JFROG_TOKEN",
          "email": "ci@example.com"
        }
      }
    }

---
# Pod using BOTH Harbor (private images) and JFrog (proxy-cached public images)
apiVersion: v1
kind: Pod
metadata:
  name: dual-registry-example
spec:
  imagePullSecrets:
    # Harbor for your private application images
    - name: harbor-pull-secret
    # JFrog for proxy-cached public images
    - name: jfrog-pull-secret
  containers:
    # Your app from Harbor
    - name: app
      image: harbor.example.com/my-app/sample-web:v1.0.0
    # Sidecar (public image cached through JFrog)
    - name: sidecar
      image: jfrog.example.com/docker-remote/redis:7-alpine
