# ServiceMonitors for ALL components in the lab:
# Argo CD, Harbor, Vault, JFrog Artifactory

# ─────────── Argo CD ───────────
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-metrics
  namespace: monitoring
  labels:
    release: kube-prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-metrics
  namespaceSelector:
    matchNames: [argocd]
  endpoints:
    - port: metrics
      interval: 30s

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-server-metrics
  namespace: monitoring
  labels:
    release: kube-prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-server-metrics
  namespaceSelector:
    matchNames: [argocd]
  endpoints:
    - port: metrics
      interval: 30s

---
# ─────────── Harbor ───────────
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: harbor-exporter
  namespace: monitoring
  labels:
    release: kube-prometheus
spec:
  selector:
    matchLabels:
      app: harbor
      component: exporter
  namespaceSelector:
    matchNames: [harbor]
  endpoints:
    - port: metrics
      interval: 30s

---
# ─────────── Vault ───────────
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vault-metrics
  namespace: monitoring
  labels:
    release: kube-prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  namespaceSelector:
    matchNames: [vault]
  endpoints:
    - port: http
      interval: 30s
      path: /v1/sys/metrics
      params:
        format: [prometheus]

---
# ─────────── JFrog Artifactory ───────────
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: jfrog-artifactory
  namespace: monitoring
  labels:
    release: kube-prometheus
spec:
  selector:
    matchLabels:
      app: artifactory
  namespaceSelector:
    matchNames: [jfrog]
  endpoints:
    - port: http
      interval: 60s
      path: /artifactory/api/v1/metrics
