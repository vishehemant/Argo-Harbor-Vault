# Secret with AVP placeholders.
# The Vault path is overridden per environment using Kustomize patches.
# Base uses a generic path — overlays replace it with env-specific paths.

apiVersion: v1
kind: Secret
metadata:
  name: myapp-config
type: Opaque
stringData:
  DB_HOST: <path:secret/data/ENVIRONMENT/myapp/config#db_host>
  DB_PORT: <path:secret/data/ENVIRONMENT/myapp/config#db_port>
  DB_NAME: <path:secret/data/ENVIRONMENT/myapp/config#db_name>
  DB_USER: <path:secret/data/ENVIRONMENT/myapp/config#db_user>
  DB_PASSWORD: <path:secret/data/ENVIRONMENT/myapp/config#db_password>
