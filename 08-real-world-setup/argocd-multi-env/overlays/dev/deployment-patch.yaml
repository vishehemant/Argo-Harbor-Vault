# Dev environment: fewer replicas, smaller resources
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-web
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: web
          env:
            - name: APP_ENV
              value: "dev"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
