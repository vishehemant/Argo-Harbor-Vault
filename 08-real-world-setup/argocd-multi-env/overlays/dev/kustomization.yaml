apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: myapp-dev

resources:
  - ../../base

patches:
  - path: deployment-patch.yaml
  - path: secret-patch.yaml

images:
  - name: harbor.example.com/my-app/sample-web
    newTag: latest

labels:
  - pairs:
      environment: dev
