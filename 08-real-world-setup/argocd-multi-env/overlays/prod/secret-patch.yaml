# Production secret — AVP reads from Vault path: secret/data/prod/myapp/config
apiVersion: v1
kind: Secret
metadata:
  name: myapp-config
stringData:
  DB_HOST: <path:secret/data/prod/myapp/config#db_host>
  DB_PORT: <path:secret/data/prod/myapp/config#db_port>
  DB_NAME: <path:secret/data/prod/myapp/config#db_name>
  DB_USER: <path:secret/data/prod/myapp/config#db_user>
  DB_PASSWORD: <path:secret/data/prod/myapp/config#db_password>
