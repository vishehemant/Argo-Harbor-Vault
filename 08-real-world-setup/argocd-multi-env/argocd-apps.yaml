# Three Argo CD Applications — one per environment.
#
# Key differences:
#   DEV  — auto-sync enabled (fast iteration)
#   UAT  — manual sync only (change manager approves Azure Pipeline stage first)
#   PROD — manual sync only (full change request + approved change window)

# ─────────────────────────── DEV ───────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/vishehemant/Argo-Harbor-Vault.git
    targetRevision: cursor/harbor-argo-vault-integration-aad0
    path: 08-real-world-setup/argocd-multi-env/overlays/dev
    plugin:
      name: argocd-vault-plugin-kustomize
  destination:
    server: https://kubernetes.default.svc
    namespace: myapp-dev
  syncPolicy:
    # DEV: auto-sync for fast iteration
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m

---
# ─────────────────────────── UAT ───────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp-uat
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: deployments
    notifications.argoproj.io/subscribe.on-sync-failed.slack: deployments
spec:
  project: default
  source:
    repoURL: https://github.com/vishehemant/Argo-Harbor-Vault.git
    targetRevision: cursor/harbor-argo-vault-integration-aad0
    path: 08-real-world-setup/argocd-multi-env/overlays/uat
    plugin:
      name: argocd-vault-plugin-kustomize
  destination:
    server: https://kubernetes.default.svc
    namespace: myapp-uat
  syncPolicy:
    # UAT: NO automated sync — manual trigger after change manager approval
    # Argo CD will show "OutOfSync" after the pipeline updates the overlay,
    # but won't deploy until someone clicks Sync or runs: argocd app sync myapp-uat
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m

---
# ─────────────────────────── PROD ───────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: prod-deployments
    notifications.argoproj.io/subscribe.on-sync-failed.slack: prod-deployments
    notifications.argoproj.io/subscribe.on-health-degraded.slack: prod-deployments
spec:
  project: default
  source:
    repoURL: https://github.com/vishehemant/Argo-Harbor-Vault.git
    targetRevision: cursor/harbor-argo-vault-integration-aad0
    path: 08-real-world-setup/argocd-multi-env/overlays/prod
    plugin:
      name: argocd-vault-plugin-kustomize
  destination:
    server: https://kubernetes.default.svc
    namespace: myapp-prod
  syncPolicy:
    # PROD: NO automated sync — manual trigger during approved change window
    # Full change management:
    #   1. Change manager approves Azure Pipeline prod stage
    #   2. Pipeline updates the prod overlay in Git
    #   3. Argo CD shows "OutOfSync"
    #   4. Senior engineer runs: argocd app sync myapp-prod
    #      during the approved change window
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
