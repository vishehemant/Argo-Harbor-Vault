# Secret with AVP placeholders — uses vaultPathPrefix from values.
#
# The Helm template renders {{ .Values.vaultPathPrefix }} first,
# then AVP resolves the <path:...#key> placeholders from Vault.
#
# Example — for prod (vaultPathPrefix = "secret/data/prod/myapp"):
#   DB_PASSWORD: <path:secret/data/prod/myapp/config#db_password>

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-config
  labels:
    {{- include "sample-web.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_HOST: <path:{{ .Values.vaultPathPrefix }}/config#db_host>
  DB_PORT: <path:{{ .Values.vaultPathPrefix }}/config#db_port>
  DB_NAME: <path:{{ .Values.vaultPathPrefix }}/config#db_name>
  DB_USER: <path:{{ .Values.vaultPathPrefix }}/config#db_user>
  DB_PASSWORD: <path:{{ .Values.vaultPathPrefix }}/config#db_password>

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-api-keys
  labels:
    {{- include "sample-web.labels" . | nindent 4 }}
type: Opaque
stringData:
  STRIPE_KEY: <path:{{ .Values.vaultPathPrefix }}/api-keys#stripe_key>
  SENDGRID_KEY: <path:{{ .Values.vaultPathPrefix }}/api-keys#sendgrid_key>
  JWT_SECRET: <path:{{ .Values.vaultPathPrefix }}/api-keys#jwt_secret>
