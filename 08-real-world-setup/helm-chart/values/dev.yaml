# Dev environment overrides

replicaCount: 1
environment: dev
vaultPathPrefix: "secret/data/dev/myapp"

image:
  tag: "latest"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

ingress:
  enabled: true
  host: myapp-dev.example.com
  tls: false

autoscaling:
  enabled: false
