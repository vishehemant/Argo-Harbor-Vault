# UAT environment overrides

replicaCount: 2
environment: uat
vaultPathPrefix: "secret/data/uat/myapp"

image:
  tag: "latest"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

ingress:
  enabled: true
  host: myapp-uat.example.com
  tls: true

autoscaling:
  enabled: false
