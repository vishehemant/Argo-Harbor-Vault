# GitHub Actions CI/CD Pipeline
#
# This workflow demonstrates the CI side of the Harbor + Argo CD + Vault pipeline.
#
# Trigger: Push to main branch (or tags matching v*)
# Steps:
#   1. Build the Docker image
#   2. Scan it with Trivy (pre-push vulnerability check)
#   3. Push to Harbor
#   4. Update the Kustomize image tag in the manifests
#   5. Commit and push → Argo CD picks up the change automatically
#
# Required GitHub Secrets:
#   HARBOR_URL       - e.g., harbor.example.com
#   HARBOR_USERNAME  - e.g., robot$ci-pipeline
#   HARBOR_PASSWORD  - Harbor robot account secret
#
# Save this file as .github/workflows/ci-cd.yaml in your repository.

name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - '01-harbor-basics/app/**'
      - '01-harbor-basics/Dockerfile'
  tags:
    - 'v*'

env:
  HARBOR_URL: ${{ secrets.HARBOR_URL }}
  IMAGE_NAME: my-app/sample-web

jobs:
  # ─────────────────────────────────────────────────────
  # Job 1: Build, scan, and push the Docker image
  # ─────────────────────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      full-image: ${{ env.HARBOR_URL }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image metadata (tag)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.HARBOR_URL }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with semver on tagged commits
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Tag with short SHA on branch commits
            type=sha,prefix=

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./01-harbor-basics
          file: ./01-harbor-basics/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.HARBOR_URL }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Push image to Harbor
        uses: docker/build-push-action@v5
        with:
          context: ./01-harbor-basics
          file: ./01-harbor-basics/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha

      - name: Summary
        run: |
          echo "### Image pushed to Harbor" >> $GITHUB_STEP_SUMMARY
          echo "- Registry: \`${{ env.HARBOR_URL }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: \`${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────
  # Job 2: Update Kubernetes manifests with new image tag
  # ─────────────────────────────────────────────────────
  update-manifests:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update image tag in Kustomize
        working-directory: 07-full-integration/app-manifests
        run: |
          kustomize edit set image \
            harbor.example.com/my-app/sample-web=${{ needs.build-and-push.outputs.full-image }}

          echo "Updated kustomization.yaml:"
          cat kustomization.yaml

      - name: Commit and push manifest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add 07-full-integration/app-manifests/kustomization.yaml
          git diff --staged --quiet || \
            git commit -m "ci: update image to ${{ needs.build-and-push.outputs.full-image }}"

          git push

      - name: Summary
        run: |
          echo "### Manifests updated" >> $GITHUB_STEP_SUMMARY
          echo "- New image: \`${{ needs.build-and-push.outputs.full-image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Argo CD will auto-sync the new version" >> $GITHUB_STEP_SUMMARY
