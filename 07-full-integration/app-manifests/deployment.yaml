# Production Deployment — Full Integration
#
# This Deployment demonstrates all three tools working together:
#   - Image pulled from HARBOR (harbor.example.com/my-app/sample-web)
#   - Image pull credentials from VAULT (via External Secrets Operator)
#   - Application secrets from VAULT (via AVP placeholders in secret.yaml)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-web
  namespace: production
  labels:
    app: sample-web
    environment: production
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: sample-web
  template:
    metadata:
      labels:
        app: sample-web
        environment: production
    spec:
      # Harbor image pull credentials (created by ESO from Vault)
      imagePullSecrets:
        - name: harbor-pull-secret

      containers:
        - name: web
          # Image from Harbor — tag is updated by CI pipeline
          image: harbor.example.com/my-app/sample-web:v1.0.0
          ports:
            - containerPort: 8080
              name: http

          # Environment variables from Vault-managed secrets
          envFrom:
            - secretRef:
                # This Secret is created by AVP from Vault (see secret.yaml)
                name: myapp-production-config

          env:
            - name: APP_ENV
              value: "production"
            - name: APP_VERSION
              value: "1.0.0"

            # Individual secret key from the API keys Secret
            - name: STRIPE_KEY
              valueFrom:
                secretKeyRef:
                  name: myapp-production-api-keys
                  key: STRIPE_KEY

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3

      # Graceful shutdown
      terminationGracePeriodSeconds: 30
