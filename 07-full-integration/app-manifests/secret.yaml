# Application Secrets with AVP (Argo Vault Plugin) placeholders.
#
# These files contain NO real secrets — only Vault path references.
# At Argo CD sync time, AVP replaces these with actual values from Vault.

apiVersion: v1
kind: Secret
metadata:
  name: myapp-production-config
  namespace: production
type: Opaque
stringData:
  DB_HOST: <path:secret/data/production/myapp/config#db_host>
  DB_PORT: <path:secret/data/production/myapp/config#db_port>
  DB_NAME: <path:secret/data/production/myapp/config#db_name>
  DB_USER: <path:secret/data/production/myapp/config#db_user>
  DB_PASSWORD: <path:secret/data/production/myapp/config#db_password>

---
apiVersion: v1
kind: Secret
metadata:
  name: myapp-production-api-keys
  namespace: production
type: Opaque
stringData:
  STRIPE_KEY: <path:secret/data/production/myapp/api-keys#stripe_key>
  SENDGRID_KEY: <path:secret/data/production/myapp/api-keys#sendgrid_key>
  JWT_SECRET: <path:secret/data/production/myapp/api-keys#jwt_secret>
