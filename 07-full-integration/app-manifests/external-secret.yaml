# External Secrets Operator resources for the full integration.
#
# ESO syncs Harbor credentials from Vault into a K8s docker-registry Secret.
# This Secret is used by the Deployment's imagePullSecrets.

# SecretStore: connection to Vault
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-production
  namespace: production
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-harbor"
          serviceAccountRef:
            name: "vault-auth-sa"

---
# ServiceAccount for ESO to authenticate with Vault
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth-sa
  namespace: production

---
# ExternalSecret: syncs Harbor credentials from Vault → K8s docker-registry Secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-pull-secret
  namespace: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-production
    kind: SecretStore
  target:
    name: harbor-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "{{ .url }}": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "email": "{{ .email }}"
              }
            }
          }
  data:
    - secretKey: url
      remoteRef:
        key: harbor/creds
        property: url
    - secretKey: username
      remoteRef:
        key: harbor/creds
        property: username
    - secretKey: password
      remoteRef:
        key: harbor/creds
        property: password
    - secretKey: email
      remoteRef:
        key: harbor/creds
        property: email
