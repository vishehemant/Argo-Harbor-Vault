# Full Integration Argo CD Application
#
# This Application uses:
#   - AVP plugin to resolve Vault secret placeholders
#   - Kustomize for manifest organization
#   - Auto-sync with self-heal for true GitOps

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: full-integration-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Notifications: send Slack alerts on sync status changes
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: deployments
    notifications.argoproj.io/subscribe.on-sync-failed.slack: deployments
    notifications.argoproj.io/subscribe.on-health-degraded.slack: deployments
spec:
  project: default

  source:
    repoURL: https://github.com/vishehemant/Argo-Harbor-Vault.git
    targetRevision: cursor/harbor-argo-vault-integration-aad0
    path: 07-full-integration/app-manifests

    # Use the AVP-Kustomize plugin (renders Kustomize then processes AVP placeholders)
    plugin:
      name: argocd-vault-plugin-kustomize

  destination:
    server: https://kubernetes.default.svc
    namespace: production

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Ignore differences that are expected (e.g., mutating webhooks add fields)
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
