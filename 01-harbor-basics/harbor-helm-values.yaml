# Harbor Helm Chart Values
# Reference: https://github.com/goharbor/harbor-helm
#
# This file configures Harbor for a development/learning environment.
# For production, you'd want persistent storage, TLS certificates, and HA.

# -- How to expose Harbor: ingress, clusterIP, nodePort, or loadBalancer
expose:
  type: nodePort
  tls:
    # In production, set to true and provide real certificates
    enabled: false
  nodePort:
    ports:
      http:
        nodePort: 30002
      https:
        nodePort: 30003

# -- External URL used to access Harbor from outside the cluster.
# This MUST match what you type in the browser / docker login command.
externalURL: https://harbor.example.com:30003

# -- Harbor admin password (change in production!)
harborAdminPassword: "Harbor12345"

# -- Internal components configuration

# The registry stores the actual image layers (blobs)
registry:
  credentials:
    username: "harbor_registry_user"
    password: "harbor_registry_password"
  # Storage backend: filesystem (default), s3, gcs, azure, etc.
  storage:
    # For learning purposes, use filesystem storage
    # In production, use S3/GCS/Azure for durability
    filesystem:
      rootdirectory: /storage

# PostgreSQL database stores metadata (projects, users, scan results)
database:
  type: internal
  internal:
    password: "changeme"

# Redis is used for caching and job queues
redis:
  type: internal

# Trivy vulnerability scanner
trivy:
  enabled: true
  # Automatically download vulnerability database
  autoUpdate: true

# -- Persistence (storage volumes)
persistence:
  enabled: true
  persistentVolumeClaim:
    registry:
      size: 5Gi
    database:
      size: 1Gi
    redis:
      size: 1Gi
    trivy:
      size: 2Gi

# -- Resource limits (relaxed for development)
# In production, set appropriate limits based on expected load
nginx:
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
portal:
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
core:
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
jobservice:
  resources:
    requests:
      memory: 256Mi
      cpu: 100m

# -- Metrics (useful for monitoring)
metrics:
  enabled: true
  serviceMonitor:
    enabled: false
