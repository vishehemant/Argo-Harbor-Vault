replicaCount: 1

image:
  repository: harbor.example.com/tetris/game
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: harbor-pull-secret

environment: dev
vaultPathPrefix: "secret/data/dev/tetris"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  host: ""
  tls: false

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilization: 75

probes:
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 30
