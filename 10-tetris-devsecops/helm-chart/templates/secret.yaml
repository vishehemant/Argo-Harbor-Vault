# AVP placeholders — resolved from Vault at sync time.
# The vaultPathPrefix changes per environment:
#   dev:  secret/data/dev/tetris
#   uat:  secret/data/uat/tetris
#   prod: secret/data/prod/tetris

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-config
  labels:
    {{- include "tetris.labels" . | nindent 4 }}
type: Opaque
stringData:
  ANALYTICS_KEY: <path:{{ .Values.vaultPathPrefix }}/config#analytics_key>
  FEATURE_FLAGS: <path:{{ .Values.vaultPathPrefix }}/config#feature_flags>
