replicaCount: 3
environment: production
vaultPathPrefix: "secret/data/prod/tetris"
image:
  tag: "latest"
resources:
  requests:
    cpu: 200m
    memory: 64Mi
  limits:
    cpu: 1000m
    memory: 256Mi
ingress:
  enabled: true
  host: tetris.example.com
  tls: true
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilization: 75
