# Argo CD Applications for Tetris — one per environment
# Dev: auto-sync | UAT: manual | Prod: manual

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tetris-dev
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/vishehemant/Argo-Harbor-Vault.git
    targetRevision: cursor/harbor-argo-vault-integration-aad0
    path: 10-tetris-devsecops/helm-chart
    plugin:
      name: argocd-vault-plugin-helm
      env:
        - name: HELM_VALUES
          value: values/dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: tetris-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true]

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tetris-uat
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: deployments
    notifications.argoproj.io/subscribe.on-sync-failed.slack: deployments
spec:
  project: default
  source:
    repoURL: https://github.com/vishehemant/Argo-Harbor-Vault.git
    targetRevision: cursor/harbor-argo-vault-integration-aad0
    path: 10-tetris-devsecops/helm-chart
    plugin:
      name: argocd-vault-plugin-helm
      env:
        - name: HELM_VALUES
          value: values/uat.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: tetris-uat
  syncPolicy:
    syncOptions: [CreateNamespace=true]

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tetris-prod
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: prod-deployments
    notifications.argoproj.io/subscribe.on-sync-failed.slack: prod-deployments
    notifications.argoproj.io/subscribe.on-health-degraded.slack: prod-deployments
spec:
  project: default
  source:
    repoURL: https://github.com/vishehemant/Argo-Harbor-Vault.git
    targetRevision: cursor/harbor-argo-vault-integration-aad0
    path: 10-tetris-devsecops/helm-chart
    plugin:
      name: argocd-vault-plugin-helm
      env:
        - name: HELM_VALUES
          value: values/prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: tetris-prod
  syncPolicy:
    syncOptions: [CreateNamespace=true, PruneLast=true]
