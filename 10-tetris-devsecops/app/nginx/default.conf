server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API endpoint — returns app info (version, environment)
    # Populated from environment variables set by Kubernetes
    location /api/info {
        default_type application/json;
        return 200 '{"version":"$APP_VERSION","environment":"$APP_ENV","hostname":"$HOSTNAME"}';
    }

    # Health check endpoint for Kubernetes probes
    location /health {
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    # Prometheus metrics endpoint (basic)
    location /metrics {
        stub_status on;
        allow all;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
}
