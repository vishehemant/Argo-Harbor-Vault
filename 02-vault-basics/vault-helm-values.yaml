# Vault Helm Chart Values
# Reference: https://developer.hashicorp.com/vault/docs/platform/k8s/helm

server:
  # Run Vault in dev mode for learning (NOT for production!)
  # Dev mode: auto-unsealed, in-memory storage, root token = "root"
  # Set to false and configure storage for production
  dev:
    enabled: false

  # Use the integrated Raft storage backend (recommended for production)
  dataStorage:
    enabled: true
    size: 1Gi

  # Single replica for learning; use 3+ for HA in production
  ha:
    enabled: false
    replicas: 1

  # Standalone mode configuration
  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        tls_disable = 1
        address     = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "file" {
        path = "/vault/data"
      }

  # Resource requests
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

  # Service configuration
  service:
    type: ClusterIP
    port: 8200

# Vault UI — access via port-forward
ui:
  enabled: true

# Vault Agent Injector — automatically injects secrets into Pod containers
# This is what makes the "sidecar" pattern work
injector:
  enabled: true
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m

# CSI Provider — alternative to injector, mounts secrets as files via CSI
csi:
  enabled: false
